<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>To-Do List</title>
    <link rel="stylesheet" href="dist/css/main.css"/>
    <script src="./js/sevedTheme.js"></script>
  </head>
  <body>
    <header class="header">
      <h1 class="visually-hidden">To-Do List</h1>

      <button class="btn header__theme-toggle js-theme-toggle" aria-label="Переключить тему" aria-pressed="false">
        <span aria-hidden="true">🌓</span>
      </button>

      <form class="header__search" role="search">
        <label for="search-input" class="visually-hidden">Поиск по названию</label>
        <input id="search-input" class="header__search-input js-search-input" type="search" placeholder="Поиск задач..."/>
      </form>

      <button class="btn header__add-btn js-open-modal">Добавить задачу</button>
    </header>

    <dialog class="todo-modal js-todo-modal" aria-labelledby="modal-title">
      <h3 id="modal-title" class="todo-modal__title js-modal-title">Добавить задачу</h3>
    
      <form class="js-modal-form" autocomplete="off">
        <div class="todo-modal__field">
          <label for="modal-title-input" class="visually-hidden">Название задачи</label>
          <input id="modal-title-input" type="text" placeholder="Название задачи" required/>
        </div>

        <div class="todo-modal__actions">
          <button type="submit" class="btn">Сохранить</button>
          <button type="button" class="btn js-modal-cancel">Отмена</button>
        </div>
      </form>
    </dialog>

    <main class="container">
      <section class="todo-section" aria-labelledby="todo-list-title">
        <h2 id="todo-list-title" class="todo-section__title">Список задач</h2>
        <ul class="js-task-list" role="list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="js/main.js" defer></script>
  </body>
</html>
